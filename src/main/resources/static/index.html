    .jk { color: #93c5fd; }
    .js { color: #86efac; }
    .jn { color: #fbbf24; }
    .jb { color: #f472b6; }
    .jz { color: #94a3b8; font-style: italic; }

    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #4b5563; }

    /* Animations */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 0.8s linear infinite; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.2s ease-out forwards; }

    /* Inputs */
    textarea { min-height: 72px; resize: vertical; }
    input[type="number"]::-webkit-inner-spin-button { opacity: 0.5; }

    /* File drop zone */
    .file-zone { transition: border-color 0.15s, background 0.15s; }
    .file-zone.drag-over { border-color: #6366f1 !important; background: rgba(99,102,241,0.08) !important; }

    .nav-item.active { background: rgba(255,255,255,0.07); }

// FILE UPLOAD HELPERS
// ══════════════════════════════════════════════════════════════════════════
function formatFileSize(bytes) {
  if (bytes < 1024)             return bytes + ' B';
  if (bytes < 1024 * 1024)      return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function getFileTypeLabel(filename) {
  if (!filename || !filename.includes('.')) return 'FILE';
  return filename.substring(filename.lastIndexOf('.') + 1).toUpperCase();
}

function getFileTypeColor(filename) {
  const ext = filename && filename.includes('.') ? filename.substring(filename.lastIndexOf('.') + 1).toLowerCase() : '';
  const map = { pdf:'text-red-400 bg-red-500/10', docx:'text-blue-400 bg-blue-500/10', txt:'text-gray-400 bg-gray-500/10',
                md:'text-purple-400 bg-purple-500/10', markdown:'text-purple-400 bg-purple-500/10',
                html:'text-orange-400 bg-orange-500/10', htm:'text-orange-400 bg-orange-500/10' };
  return map[ext] || 'text-indigo-400 bg-indigo-500/10';
}

function _applyFileToZone(id, file) {
  fileStore[id] = file;
  const zone      = document.getElementById(`${id}-zone`);
  const emptyEl   = document.getElementById(`${id}-empty`);
  const previewEl = document.getElementById(`${id}-preview`);
  const nameEl    = document.getElementById(`${id}-fname`);
  const sizeEl    = document.getElementById(`${id}-fsize`);
  const typeEl    = document.getElementById(`${id}-ftype`);
  if (zone)      zone.classList.remove('drag-over');
  if (emptyEl)   emptyEl.classList.add('hidden');
  if (previewEl) { previewEl.classList.remove('hidden'); previewEl.classList.add('file-preview-enter'); }
  if (nameEl)    nameEl.textContent = file.name;
  if (sizeEl)    sizeEl.textContent = formatFileSize(file.size);
  if (typeEl)    { typeEl.textContent = getFileTypeLabel(file.name); typeEl.className = `text-[9px] font-bold px-1.5 py-0.5 rounded font-mono ${getFileTypeColor(file.name)}`; }
}

function handleFileSelect(input, id) {
  const file = input.files[0];
  if (file) _applyFileToZone(id, file);
}

function handleFileDrop(event, id) {
  event.preventDefault();
  document.getElementById(`${id}-zone`)?.classList.remove('drag-over');
  const file = event.dataTransfer?.files[0];
  if (!file) return;
  // Sync the native <input> so FormData and reset work correctly
  try { const dt = new DataTransfer(); dt.items.add(file); document.getElementById(`${id}-input`).files = dt.files; } catch {}
  _applyFileToZone(id, file);
}

function clearFileInput(event, id) {
  event.stopPropagation();
  delete fileStore[id];
  const input = document.getElementById(`${id}-input`);
  if (input) input.value = '';
  const emptyEl   = document.getElementById(`${id}-empty`);
  const previewEl = document.getElementById(`${id}-preview`);
  if (emptyEl)   emptyEl.classList.remove('hidden');
  if (previewEl) previewEl.classList.add('hidden');
}

function findEndpoint(id) { for (const m of MODULES) { const e = m.endpoints.find(ep => ep.id === id); if (e) return e; } return null; }

function methodBadge(m) {
  return `<span class="text-[10px] font-bold px-2 py-0.5 rounded font-mono ${METHOD_CLS[m] || 'bg-gray-500/20 text-gray-300'}">${m}</span>`;
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function syntaxHighlight(json) {
  let out = '', i = 0;
  while (i < json.length) {
    const ch = json[i];
    if (ch === '"') {
      let end = i + 1;
      while (end < json.length) {
        if (json[end] === '\\') { end += 2; continue; }
        if (json[end] === '"') { end++; break; }
        end++;
      }
      const raw = json.slice(i, end);
      const isKey = json.slice(end).trimStart().startsWith(':');
      const esc = raw.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      out += `<span class="${isKey ? 'jk' : 'js'}">${esc}</span>`;
      i = end;
    } else if (ch === 't' && json.startsWith('true',  i)) { out += '<span class="jb">true</span>';  i += 4; }
    else if   (ch === 'f' && json.startsWith('false', i)) { out += '<span class="jb">false</span>'; i += 5; }
    else if   (ch === 'n' && json.startsWith('null',  i)) { out += '<span class="jz">null</span>';  i += 4; }
    else if (ch === '-' || (ch >= '0' && ch <= '9')) {
      let end = i;
      while (end < json.length && /[-\d.eE+]/.test(json[end])) end++;
      out += `<span class="jn">${json.slice(i, end)}</span>`;
      i = end;
    } else {
      out += ch === '&' ? '&amp;' : ch === '<' ? '&lt;' : ch === '>' ? '&gt;' : ch;
      i++;
    }
  }
  return out;
}

function locBadge(loc) {
  const cls = loc === 'body'  ? 'bg-blue-500/10   text-blue-400'
            : loc === 'query' ? 'bg-emerald-500/10 text-emerald-400'
            :                   'bg-orange-500/10  text-orange-400';
  return `<span class="text-[9px] px-1 py-0.5 rounded font-mono ${cls}">${loc}</span>`;
}

// ══════════════════════════════════════════════════════════════════════════
// REQUEST EXECUTION
// ══════════════════════════════════════════════════════════════════════════
function getFormValues(ep) {
  const vals = {};
  for (const f of (ep.fields || [])) {
    if (f.type === 'file') continue;  // handled separately via fileStore
    const el = document.getElementById(`ep-f-${ep.id}-${f.name}`);
    vals[f.name] = el ? el.value : (f.default !== undefined ? String(f.default) : '');
  }
  return vals;
}

function buildFetch(ep, vals) {
  let url = ep.path;
  const qp   = new URLSearchParams();
  const body = {};
  let hasBody = false;

  for (const f of (ep.fields || [])) {
    let v = vals[f.name];
    if (v === '' || v === undefined || v === null) v = f.default !== undefined ? f.default : null;
    if (v === null || v === undefined || v === '') continue;
    const typed = f.type === 'number' ? Number(v) : String(v);
    if      (f.loc === 'path')  url = url.replace(`{${f.name}}`, encodeURIComponent(String(typed)));
    else if (f.loc === 'query') qp.set(f.name, String(typed));
    else if (f.loc === 'body')  { body[f.name] = typed; hasBody = true; }
  }

  const qs = qp.toString();
  if (qs) url += '?' + qs;

  const opts = { method: ep.method, headers: {} };
  if (hasBody) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  return { url, opts };
}

/**
 * Build a multipart/form-data fetch when one or more fields have type 'file'.
 * The browser sets the correct Content-Type boundary automatically.
 */
function buildFormDataFetch(ep) {
  let url = ep.path;
  const qp = new URLSearchParams();
  const fd = new FormData();

  for (const f of (ep.fields || [])) {
    if (f.type === 'file') {
      const fileId = `ep-f-${ep.id}-${f.name}`;
      const file   = fileStore[fileId];
      if (file) fd.append(f.name, file, file.name);
      continue;
    }
    const el = document.getElementById(`ep-f-${ep.id}-${f.name}`);
    let v = el ? el.value : (f.default !== undefined ? String(f.default) : '');
    if (!v && f.default !== undefined) v = String(f.default);
    if (!v) continue;
    const typed = f.type === 'number' ? Number(v) : String(v);
    if      (f.loc === 'path')  url = url.replace(`{${f.name}}`, encodeURIComponent(String(typed)));
    else if (f.loc === 'query') qp.set(f.name, String(typed));
    else                        fd.append(f.name, String(typed));
  }

  const qs = qp.toString();
  if (qs) url += '?' + qs;

  // No Content-Type header — let the browser set multipart/form-data with boundary
  return { url, opts: { method: ep.method, body: fd } };
}

async function submitRequest(epId) {
  const ep = findEndpoint(epId);
  if (!ep) return;

  const hasFileFields = (ep.fields || []).some(f => f.type === 'file');

  // Validate required file fields before sending
  if (hasFileFields) {
    const missing = (ep.fields || []).find(f => f.type === 'file' && f.req && !fileStore[`ep-f-${ep.id}-${f.name}`]);
    if (missing) {
      document.getElementById(`ep-resp-${epId}`).innerHTML = `
        <div class="border-t border-gray-800 px-4 py-3">
          <div class="flex items-start gap-2 bg-amber-500/10 border border-amber-500/20 rounded-lg p-3">
            <svg class="w-4 h-4 text-amber-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <div>
              <div class="text-xs font-semibold text-amber-400">File Required</div>
              <div class="text-xs text-amber-300/70 mt-0.5">Please select or drop a file before running.</div>
            </div>
          </div>
        </div>`;
      return;
    }
  }

  const { url, opts } = hasFileFields
    ? buildFormDataFetch(ep)
    : buildFetch(ep, getFormValues(ep));

  // Cancel any in-flight request for this endpoint
  if (abortControllers[epId]) abortControllers[epId].abort();
  const ctrl = new AbortController();
  abortControllers[epId] = ctrl;
  opts.signal = ctrl.signal;

  const btn     = document.getElementById(`ep-btn-${epId}`);
  const timerEl = document.getElementById(`ep-timer-${epId}`);
  const respEl  = document.getElementById(`ep-resp-${epId}`);

  // Loading state
  btn.disabled   = true;
  btn.innerHTML  = `${spinIcon()} Running…`;
  timerEl.textContent = '';
  respEl.innerHTML = `
    <div class="border-t border-gray-800 px-4 py-3 flex items-center gap-2 text-xs text-gray-500">
      ${spinIcon()} <span>Waiting for response…</span>
    </div>`;

  const t0       = Date.now();
  const interval = setInterval(() => {
    timerEl.textContent = ((Date.now() - t0) / 1000).toFixed(1) + 's';
  }, 100);

  try {
    const res     = await fetch(url, opts);
    const elapsed = ((Date.now() - t0) / 1000).toFixed(2);
    clearInterval(interval);
    timerEl.textContent = elapsed + 's';

    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch { data = text; }

    const rawStr     = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
    responseCache[epId] = rawStr;
    const highlighted = typeof data === 'string' ? escapeHtml(data) : syntaxHighlight(rawStr);
    const okCls       = res.ok
      ? 'bg-emerald-500/15 text-emerald-300'
      : 'bg-red-500/15 text-red-300';

    respEl.innerHTML = `
      <div class="border-t border-gray-800">
        <div class="flex items-center justify-between px-4 py-2 bg-gray-950/60">
          <div class="flex items-center gap-2">
            <span class="text-[10px] font-bold px-2 py-0.5 rounded font-mono ${okCls}">${res.status} ${res.statusText}</span>
            <span class="text-xs text-gray-500 font-mono">${elapsed}s</span>
          </div>
          <button id="ep-copy-${epId}" onclick="copyResponse('${epId}')"
            class="text-xs text-gray-500 hover:text-gray-300 flex items-center gap-1 transition-colors">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
            Copy
          </button>
        </div>
        <div class="px-4 pb-4 pt-2">
          <pre class="bg-gray-950 rounded-lg p-3 text-xs mono overflow-x-auto max-h-80 overflow-y-auto leading-relaxed whitespace-pre-wrap break-all">${highlighted}</pre>
        </div>
      </div>`;
  } catch (err) {
    clearInterval(interval);
    timerEl.textContent = '';
    if (err.name !== 'AbortError') {
      respEl.innerHTML = `
        <div class="border-t border-gray-800 px-4 py-3">
          <div class="flex items-start gap-2 bg-red-500/10 border border-red-500/20 rounded-lg p-3">
            <svg class="w-4 h-4 text-red-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <div>
              <div class="text-xs font-semibold text-red-400">Request Failed</div>
              <div class="text-xs text-red-300/70 mt-0.5">${escapeHtml(err.message)}</div>
            </div>
          </div>
        </div>`;
    }
  } finally {
    btn.disabled  = false;
    btn.innerHTML = `${runIcon()} Run`;
  }
}

// ══════════════════════════════════════════════════════════════════════════
// CLIPBOARD
// ══════════════════════════════════════════════════════════════════════════
function copyResponse(epId) {
  const text = responseCache[epId] || '';
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById(`ep-copy-${epId}`);
    if (!btn) return;
    const orig = btn.innerHTML;
    btn.innerHTML = `
      <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
      </svg> Copied!`;
    btn.classList.add('text-emerald-400');
    setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('text-emerald-400'); }, 1800);
  }).catch(() => {/* ignore clipboard errors */});
}

// ══════════════════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════════════════
renderNav();
showWelcome();
</script>
