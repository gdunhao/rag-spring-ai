spring:
  application:
    name: rag-spring-ai
  # ── MVC request-logging filter ─────────────────────────────────────────
  mvc:
    log-request-details: true

  # ── Multipart file upload ───────────────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 52MB

  # ── PostgreSQL datasource (matches docker-compose.yml) ─────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/ragdb
    username: raguser
    password: ragpassword
    driver-class-name: org.postgresql.Driver

  # ── Spring AI ──────────────────────────────────────────────────────────
  ai:
    ollama:
      base-url: http://localhost:11434
      # Allow up to 5 minutes for a single LLM call (tool-calling involves multiple
      # round trips; qwen3:4b on CPU can take 60-120 s per trip)
      client:
        read-timeout: PT5M
        connect-timeout: PT30S
      chat:
        options:
          model: qwen3:4b
          temperature: 0.7
          # Cap generation length to keep demo responses snappy
          num-predict: 512
      embedding:
        options:
          model: nomic-embed-text

    vectorstore:
      pgvector:
        # Create the vector_store table and pgvector extension automatically
        initialize-schema: true
        # Must match the embedding model output dimension (nomic-embed-text = 768)
        dimensions: 768
        index-type: HNSW
        distance-type: COSINE_DISTANCE

server:
  port: 8080

logging:
  level:
    root: INFO
    # ── Application layers ──────────────────────────────────────────────────
    com.example.rag_spring_ai: DEBUG
    # ── Spring AI advisor chain (QuestionAnswerAdvisor, SimpleLoggerAdvisor) ─
    org.springframework.ai.chat.client.advisor: INFO
    # ── Spring AI VectorStore operations ──────────────────────────────────
    org.springframework.ai.vectorstore: DEBUG
    # ── Spring AI Ollama HTTP client ───────────────────────────────────────
    org.springframework.ai.ollama: INFO
    # ── Spring AI embedding pipeline ──────────────────────────────────────
    org.springframework.ai.embedding: DEBUG
    # ── Suppress noisy libraries ──────────────────────────────────────────
    org.apache.tika: WARN
    org.postgresql: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %5level [%35.35logger{34}] %msg%n"
    file:    "%d{yyyy-MM-dd HH:mm:ss.SSS} %5level [%logger{50}] %msg%n"
  file:
    name: logs/rag-spring-ai.log
